<script id="setup-pets-views" type="text/plain">

<script id="setup-averages" type="text/plain">
CREATE TABLE pets (name text, age int, weight int, kind text);
INSERT INTO pets VALUES ('Casa', 9, 12, 'cat');
INSERT INTO pets VALUES ('Kira', 7, 10, 'cat');
INSERT INTO pets VALUES ('Toby', 17, 40, 'dog');

CREATE TABLE averages AS SELECT kind, AVG(age) AS a FROM pets GROUP BY kind;

</script>
